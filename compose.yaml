name: product-mall-local

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-product_mall_dev}
      POSTGRES_USER: ${POSTGRES_USER:-product_mall_dev}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-15432}:5432
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

secrets:
  postgres_password:
    file: ./secrets/postgres_password

volumes:
  pgdata:
