name: Engineering quality

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pc-admin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.15.1'
      - run: pnpm install --frozen-lockfile
      - run: npm test
      - run: npm run test:coverage
      - run: pnpm audit --audit-level=high
      - run: pnpm exec playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: pc-coverage-and-browser
          path: |
            pc-admin/coverage/
            pc-admin/playwright-report/
            pc-admin/test-results/
          retention-days: 7

  mini-program:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: mini-program
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - run: npm test
      - run: npm run test:coverage

      - name: Mini Program upload adapter regressions
        run: npm test
        working-directory: mini-ci-worker

  backend-and-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: mall_ci
          POSTGRES_DB: mall_ci
          # Ephemeral CI-only database; never uses deployment secrets.
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mall_ci -d mall_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_USER: mall_ci
      POSTGRES_DB: mall_ci
      POSTGRES_PASSWORD: ${{ github.run_id }}
      POSTGRES_TEST_DB: test_health_ci
      DJANGO_DEBUG: '1'
      EXCHANGE_ORDER_ENABLED: '0'
      MALL_MEDIA_ROOT: /tmp/mall-media-${{ github.run_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python pc-admin/scripts/test-browser-launcher.py
      - name: Verify deployment and recovery guards
        run: |
          python scripts/e5-backup-restore-test.py
          python scripts/e5-preflight-test.py
          python scripts/e5-uat-test.py
          docker pull python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c
          docker run --rm --network none --read-only --user 0:0 \
            --tmpfs /tmp:rw,nosuid,size=16777216 \
            --mount type=bind,source="$PWD/scripts",target=/tests,readonly \
            --entrypoint python \
            python:3.12.12-slim-bookworm@sha256:593bd06efe90efa80dc4eee3948be7c0fde4134606dd40d8dd8dbcade98e669c \
            /tests/e5-secret-linux-test.py
          docker pull nginx:stable-alpine3.24-slim@sha256:32463212baf0e7d91aded2e9b843a4f2b9e017804b8c9d5bae7b51dcef64389c
          python scripts/e5-proxy-test.py
      - run: python manage.py makemigrations --check --dry-run
        working-directory: backend
      - run: python -m coverage run manage.py test --noinput
        working-directory: backend
      - run: |
          python -m coverage report
          python -m coverage report --include='common/http.py' --fail-under=90
          python -m coverage report --include='aftersales/task_reads.py' --fail-under=80
          python -m coverage report --include='fulfillment/task_reads.py' --fail-under=80
          for module in catalog/description.py catalog/inventory_access.py inventory/selection.py inventory/catalog_media.py; do
            python -m coverage report --include="$module" --fail-under=80
          done
          for module in wechat_integration/*.py; do
            python -m coverage report --include="$module" --fail-under=80
          done
          python -m coverage xml
        working-directory: backend
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: '11.15.1'
      - run: pnpm install --frozen-lockfile
        working-directory: pc-admin
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: pc-admin
      - run: npm run test:integration
        working-directory: pc-admin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-and-integration
          path: |
            backend/coverage/
            pc-admin/playwright-report/
            pc-admin/test-results/
          retention-days: 7
